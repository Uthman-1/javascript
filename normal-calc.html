<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorful Calculator</title>

<style>
body {
    background: #0f172a;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.calculator {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 20px #3b82f6;
    text-align: center;
    width: 320px;
}

.calculator h2 {
    margin-bottom: 20px;
    color: #3b82f6;
}

input[type="number"], input#result {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #3b82f6;
    text-align: center;
    font-size: 16px;
}

button.operation {
    padding: 12px 20px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: white;
    transition: transform 0.1s;
}

button.operation:hover {
    transform: scale(1.1);
}

/* Colors for each operation */
button#add { background: #22c55e; }
button#subtract { background: #ef4444; }
button#multiply { background: #facc15; color: black; }
button#divide { background: #3b82f6; }
</style>

</head>
<body>
      <a href="adjust-clock.html">stop watch</a>
    <a href="agecalculator.html">age calculator</a>
    <a href="clock.html">clock</a>
    <a href="battery.html">battery</a>
    <a href="my -guess-game2.html">Guess game</a>
    <a href="uber.html">uber app</a>
    <a href="normal-calc.html">simple calculator</a>

<div class="calculator">
    <h2>Simple Calculator</h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <div>
        <button class="operation" id="add">+</button>
        <button class="operation" id="subtract">−</button>
        <button class="operation" id="multiply">×</button>
        <button class="operation" id="divide">÷</button>
    </div>
    <input type="text" id="result" placeholder="Result" readonly>
</div>

<script>
const num1 = document.getElementById('num1');
const num2 = document.getElementById('num2');
const result = document.getElementById('result');

document.getElementById('add').addEventListener('click', () => {
    result.value = Number(num1.value) + Number(num2.value);
});

document.getElementById('subtract').addEventListener('click', () => {
    result.value = Number(num1.value) - Number(num2.value);
});

document.getElementById('multiply').addEventListener('click', () => {
    result.value = Number(num1.value) * Number(num2.value);
});

document.getElementById('divide').addEventListener('click', () => {
    if (Number(num2.value) === 0) {
        result.value = "Cannot divide by 0";
    } else {
        result.value = Number(num1.value) / Number(num2.value);
    }
});
</script>

</body>
</html>
