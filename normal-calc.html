<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<div class="calculator">
    <h2>Simple Calculator</h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <select id="operator">
      <option value="+">+</option>
      <option value="-">−</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>
    <input type="number" id="num2" placeholder="Enter second number">
    <button id="calcBtn">Calculate</button>
    <input type="text" id="result" placeholder="Result" readonly>
  </div>

  <script>
    document.querySelector('#calcBtn').addEventListener('click', calculate);

    function calculate() {
      let Firstno = document.getElementById('num1').value;
      let secondnumber= document.getElementById('num2').value;
      let symbols= document.getElementById('operator').value;

      // Using eval to handle operation dynamically (no if/else)
      document.getElementById('result').value = eval(Firstno + symbols + secondno);
    }
  </script>


</body>
</html>
