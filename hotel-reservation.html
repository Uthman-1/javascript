<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTHMAN STAY - Hotel App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background: #222;
            color: lemonchiffon;
        }

        button {
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            margin: 5px;
        }

        input {
            padding: 8px;
            width: 100%;
        }

        .hide {
            display: none;
        }
    </style>
</head>

<body>

    <!-- NAME FORM -->
    <div id="hotelForm" class="container mt-5">
        <h2 class="text-center">WELCOME</h2>

        <label>First Name</label>
        <input type="text" id="firstName">
        <p id="error1"></p>

        <label>Last Name</label>
        <input type="text" id="lastName">
        <p id="error2"></p>

        <button id="next">Next</button>
    </div>

    <!-- ACCOMMODATION TYPE -->
    <div id="typeOfAccomodation" class="container hide text-center mt-5">
        <p id="userName"></p>
        <button id="freeAcc">Free Accommodation</button>
        <button id="hotelAcc">Hotel Accommodation</button>
    </div>

    <!-- FREE -->
    <div id="forFree" class="container hide text-center mt-5">
        <p id="forFreeC"></p>
        <button id="returnToHome">Back</button>
    </div>

    <!-- DATE -->
    <div id="forHotel" class="container hide mt-5 text-center">
        <p>Select Check-in Date</p>
        <input type="date" id="duration">
        <button id="dateButton">Choose</button>
        <p id="myPara"></p>
        <button id="daysNext">Next</button>
        <button id="daysBack">Back</button>
    </div>

    <!-- ROOMS -->
    <div id="typeOfRoom" class="container hide text-center mt-5">
        <p id="daysMany"></p>

        <div class="allRoom">
            <button data-room="Old Building" data-price="11500">Old Building Suite - ₦11,500</button>
            <button data-room="Standard" data-price="25700">Standard Suite - ₦25,700</button>
            <button data-room="Supreme" data-price="48000">Supreme Suite - ₦48,000</button>
            <button data-room="Presidential" data-price="96100">Presidential Suite - ₦96,100</button>
            <button data-room="A1" data-price="150000">A1 Suite - ₦150,000</button>
        </div>
    </div>

    
    <div id="payment" class="container hide text-center mt-5"></div>

    
    <script>
        let firstName, lastName, checkInDate;
        let days = 1;
        let roomName = "";
        let roomPrice = 0;

        const sections = ["hotelForm", "typeOfAccomodation", "forFree", "forHotel", "typeOfRoom", "payment"];

        function hideAll() {
            sections.forEach(id => document.getElementById(id).classList.add("hide"));
        }

        hideAll();
        document.getElementById("hotelForm").classList.remove("hide");

        document.getElementById("next").onclick = () => {
            firstName = firstNameInput.value.trim();
            lastName = lastNameInput.value.trim();

            if (!firstName) return error1.innerText = "First name required";
            if (!lastName) return error2.innerText = "Last name required";

            error1.innerText = "";
            error2.innerText = "";

            hideAll();
            typeOfAccomodation.classList.remove("hide");
            userName.innerText = `Welcome ${firstName} ${lastName}`;
        };

        freeAcc.onclick = () => {
            hideAll();
            forFree.classList.remove("hide");
            forFreeC.innerText = "Free accommodation is unavailable.";
        };

        returnToHome.onclick = () => {
            hideAll();
            typeOfAccomodation.classList.remove("hide");
        };

        hotelAcc.onclick = () => {
            hideAll();
            forHotel.classList.remove("hide");
        };

        dateButton.onclick = () => {
            checkInDate = duration.value;
            if (!checkInDate) return myPara.innerText = "Select a date";
            myPara.innerText = `Check-in: ${checkInDate} | Stay: 1 day`;
        };

        daysNext.onclick = () => {
            if (!checkInDate) return alert("Select date");
            hideAll();
            typeOfRoom.classList.remove("hide");
            daysMany.innerText = "Staying for 1 day";
        };

        daysBack.onclick = () => {
            hideAll();
            typeOfAccomodation.classList.remove("hide");
        };

        document.querySelectorAll(".allRoom button").forEach(btn => {
            btn.onclick = () => {
                roomName = btn.dataset.room;
                roomPrice = Number(btn.dataset.price);
                showPayment();
            };
        });

        function showPayment() {
            hideAll();
            payment.classList.remove("hide");

            const total = roomPrice * days;

            payment.innerHTML = `
                <h3>Payment Summary</h3>
                <p>Name: ${firstName} ${lastName}</p>
                <p>Room: ${roomName}</p>
                <p>Total: ₦${total}</p>
                <button id="payNow">Pay Now</button>
            `;

            document.getElementById("payNow").onclick = () => {
                payment.innerHTML += "<p>Payment Successful ✅</p>";
                saveData(total);
            };
        }

        function saveData(amount) {
            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: `${firstName} ${lastName}`,
                    room: roomName,
                    amount,
                    date: checkInDate
                })
            }).then(res => res.json()).then(data => console.log(data));
        }
    </script>

</body>
</html>
