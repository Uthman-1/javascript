<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Reservation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>

/* ===== COLORFUL CSS ===== */

body{
    font-family: Arial, sans-serif;
    background: #134e4a;
    color: white;
    text-align: center;
}

/* navigation button */
.menuBtn{
    background: #1d4ed8;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

/* panels */
.panel{
    display: none;
    background: #f1f5f9;
    width: 380px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
    color: black;
}

button{
    width: 180px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

.nextbtn{
    background: #0d9488;
    color: white;
}

.backbtn{
    background: #dc2626;
    color: white;
}

.checkbtn{
    background: #16a34a;
    color: white;
}

.summaryBox{
    color: lemonchiffon;
}

#myPara{
    margin-top: 10px;
}

</style>

</head>


<body>

<!-- ===== YOU MUST HAVE THIS ID ===== -->
<button id="hotelAcc" class="menuBtn">Hotel Accommodation</button>


<!-- ===== DATE PANEL ===== -->
<div id="forHotel" class="panel">

<h2>Select Date</h2>

<input id="duration" type="date" class="form-control"/>

<p id="myPara"></p>

<button id="dateButton" class="checkbtn">Check Date</button>

<button id="daysNext" class="nextbtn">Next</button>

</div>


<!-- ===== ACCOMODATION PANEL ===== -->
<div id="typeOfAccomodation" class="panel">

<h2>Accommodation Type</h2>

<button id="daysBack" class="backbtn">Back</button>

<button id="roomGo" class="nextbtn">Choose Room</button>

</div>


<!-- ===== ROOM PANEL ===== -->
<div id="typeOfRoom" class="panel">

<h2>Choose Room</h2>

<div class="allRoom">
<button id="standard">Standard</button>
<button id="Supreme">Supreme</button>
<button id="Presidential">Presidential</button>
<button id="A1">A1</button>
<button id="old">Old Building</button>
</div>

<p id="daysMany"></p>

<button id="daysBack2" class="backbtn">Back</button>

</div>

<h2 id="highest"></h2>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* ===== GLOBAL DEFINITIONS ===== */

let stayDate = "";
let roomName = "";
let roomPrice = 0;
let stayDays = 1;

/* demo user variables so summary will not crash */
let fName = "Guest";
let lName = "";


/* ===== HIDE ALL PANELS ===== */

function hideAll(){

let panels = document.getElementsByClassName("panel");

for (let i=0; i<panels.length; i++){
    panels[i].style.display = "none";
}

}


/* ===== MENU BUTTON ===== */

document.getElementById("hotelAcc").addEventListener("click", () => {
hideAll();
document.getElementById("forHotel").style.display = "block";
});


/* ===== DATE BUTTON ===== */

document.getElementById("dateButton").addEventListener("click", () => {

stayDate = document.getElementById("duration").value;

if (stayDate === ""){
document.getElementById("myPara").innerText =
"Please select a date";
}
else{
document.getElementById("myPara").innerText =
You selected ${stayDate} as your check-in date;
}

});


/* ===== DAYS NEXT ===== */

document.getElementById("daysNext").addEventListener("click", () => {

if (stayDate === ""){
alert("Please choose a date first");
return;
}

hideAll();

document.getElementById("typeOfRoom").style.display = "block";

document.getElementById("daysMany").innerText =
Staying for ${stayDays} day(s);

});


/* ===== BACK BUTTONS ===== */

document.getElementById("daysBack").addEventListener("click", () => {
hideAll();
document.getElementById("forHotel").style.display = "block";
});

document.getElementById("daysBack2").addEventListener("click", () => {
hideAll();
document.getElementById("typeOfAccomodation").style.display = "block";
});


/* ===== ROOM SELECTION ===== */

const roomButtons =
document.getElementsByClassName("allRoom")[0]
.getElementsByTagName("button");
for (let i = 0; i < roomButtons.length; i++){

roomButtons[i].addEventListener("click", () => {

let id = roomButtons[i].id;

if (id === "standard"){
roomName = "Standard Suite";
roomPrice = 25700;
}
else if (id === "Supreme"){
roomName = "Supreme Suite";
roomPrice = 48000;
}
else if (id === "Presidential"){
roomName = "Presidential Suite";
roomPrice = 96100;
}
else if (id === "A1"){
roomName = "A1 Suite";
roomPrice = 150000;
}
else{
roomName = "Old Building Suite";
roomPrice = 11500;
}

showSummary();

});

}


/* ===== SHOW SUMMARY ===== */

function showSummary(){

hideAll();

const summary = document.createElement("div");

summary.className = "summaryBox";

summary.innerHTML = `
<h2>Reservation Successful</h2>
<p>Name: ${fName} ${lName}</p>
<p>Room: ${roomName}</p>
<p>Price: ₦${roomPrice}</p>
<p>Date: ${stayDate}</p>
`;

document.body.appendChild(summary);

saveData();

}


/* ===== SAVE DATA ===== */

function saveData(){

fetch("https://jsonplaceholder.typicode.com/posts", {

method:"POST",

headers:{"Content-Type":"application/json"},

body: JSON.stringify({
name: ${fName} ${lName},
room: roomName,
price: roomPrice,
date: stayDate
})

})
.then(res => res.json())
.then(data => console.log("Saved:", data))
.catch(err => console.log(err));

}


/* ===== START PANEL ===== */

document.getElementById("forHotel").style.display = "block;

</script>

</body>
</html>
