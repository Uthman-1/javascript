<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class list add</title>
</head>

<body>
    
<button class="paid">-</button>

    <script>

            let a = document.querySelector('button')
            a.type = "number"
            a.style.backgroundColor = 'blue';
            a.classList.add('paid');

    </script>
</body>
</html>
