<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form style="margin-left:200px; width: 500px; background: red; padding:15px 20px">
        <label>Select your Country:</label><br>
        <select id="selectcountry">
            <option value="select country">select country</option>
        </select><br><br>

         <label>Select your State:</label><br> <br> <br> <br><br><br><br>
 
        <select id="selectstate">
            <option value="select state">select State</option>
        </select><br><br>

         <label>Select your Local Government/City:</label><br>
        <select id="selectlga">
            <option value="select lga">select LGA/City</option>
        </select><br><br>

        <script>
            let selectcountry= document.getElementById('selectcountry');
            let selectstate= document.getElementById('selectstate');
            let selectlga= document.getElementById('selectlga');

            async function fetchcountry(){
                const response= await fetch("https://countriesnow.space/api/v0.1/countries");
                const result = await response.json();
                result.data.forEach(x=>{
                    const option=document.createElement('option');
                    option.value= x.country;
                    option.textContent = x.country;
                    selectcountry.appendChild(option)
                })

            }

            fetchcountry();

            selectcountry.addEventListener('change', async ()=>{
                selectstate.innerHTML="<option value='select state'>select State</option>";
                selectlga.innerHTML="<option value='select lga'>select LGA/City</option>"
                const country= selectcountry.value;
                if(!country) return;
               
                const response= await fetch("https://countriesnow.space/api/v0.1/countries/states",
                    {method: "POST",
                     headers:{"content-type": "application/json"},
                     body: JSON.stringify({country})   
                    }
                )

                const result= await response.json();
                console.log(result);
                result.data.states.forEach(x =>{
                    const option = document.createElement('option');
                    option.value= x.name;
                    option.textContent= x.name;
                    selectstate.appendChild(option)
                })

            })


              selectstate.addEventListener('change', async ()=>{
                selectlga.innerHTML="<option value='select lga'>select LGA/City</option>"
                const country= selectcountry.value;
                const state= selectstate.value;
                if(!country) return;


            const response=await fetch ('https://countriesnow.space/api/v0.1/countries/cities',
                {method:'POST',
                    headers:{'content-type': 'application/json'},
                    body: JSON.stringify({country})
                        // country:country
                        // state:state
                }
            )

            const result=await response.json();
            console.log(result);
            result.data.cities.forEach(city=>{
                const option = document.createElement('option');
                option.value=city;
            option.textContent=city;
                selectlga.appenchild(option)
            })
               })
            




        </script>
    </form>
    
</body>
</html>
