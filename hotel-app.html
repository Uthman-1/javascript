        </div>
    </div>
</body>


<script>
    // ================= GLOBAL VARIABLES =================
let fName = "";
let lName = "";
let stayDate = "";
let roomName = "";
let roomPrice = 0;

// ================= PAGE SECTIONS =================
const sections = [
    "hotelForm",
    "typeOfAccomodation",
    "forFree",
    "forHotel",
    "typeOfRoom"
];

// ================= HIDE ALL SECTIONS =================
function hideAll() {
    for (let i = 0; i < sections.length; i++) {
        document.getElementById(sections[i]).style.display = "none";
    }
}

// ================= INITIAL VIEW =================
hideAll();
document.getElementById("hotelForm").style.display = "block";

// ================= NAME PAGE =================
document.getElementById("next").addEventListener("click", () => {
    fName = document.getElementById("firstName").value.trim();
    lName = document.getElementById("lastName").value.trim();

    if (fName === "") {
        document.getElementById("error1").innerText = "First name required";
        return;
    } else {
        document.getElementById("error1").innerText = "";
    }

    if (lName === "") {
        document.getElementById("error2").innerText = "Last name required";
        return;
    } else {
        document.getElementById("error2").innerText = "";
    }

    hideAll();
    document.getElementById("typeOfAccomodation").style.display = "block";
    document.getElementById("userName").innerText = `Welcome ${fName} ${lName}`;
});

// ================= FREE ACCOMMODATION =================
document.getElementById("freeAcc").addEventListener("click", () => {
    hideAll();
    document.getElementById("forFree").style.display = "block";
    document.getElementById("forFreeC").innerText =
        `${fName}, free accommodation is currently unavailable.`;
});

document.getElementById("returnToHome").addEventListener("click", () => {
    hideAll();
    document.getElementById("typeOfAccomodation").style.display = "block";
});

// ================= HOTEL ACCOMMODATION =================
document.getElementById("hotelAcc").addEventListener("click", () => {
    hideAll();
    document.getElementById("forHotel").style.display = "block";
});

// ================= DATE SELECTION =================
document.getElementById("dateButton").addEventListener("click", () => {
    stayDate = document.getElementById("duration").value;

    if (stayDate === "") {
        document.getElementById("myPara").innerText = "Please select a date";
    } else {
        document.getElementById("myPara").innerText =
            `You selected ${stayDate} as your check-in date`;
    }
});

document.getElementById("daysNext").addEventListener("click", () => {
    if (stayDate === "") {
        alert("Please choose a date first");
        return;
    }
    hideAll();
    document.getElementById("typeOfRoom").style.display = "block";
    document.getElementById("daysMany").innerText = "Staying for 1 day";
});

document.getElementById("daysBack").addEventListener("click", () => {
    hideAll();
    document.getElementById("typeOfAccomodation").style.display = "block";
});

// ================= ROOM SELECTION =================
const roomButtons = document.getElementsByClassName("allRoom")[0].getElementsByTagName("button");

for (let i = 0; i < roomButtons.length; i++) {
    roomButtons[i].addEventListener("click", () => {
        if (roomButtons[i].id === "standard") {
            roomName = "Standard Suite";
            roomPrice = 25700;
        } else if (roomButtons[i].id === "Supreme") {
            roomName = "Supreme Suite";
            roomPrice = 48000;
        } else if (roomButtons[i].id === "Presidential") {
            roomName = "Presidential Suite";
            roomPrice = 96100;
        } else if (roomButtons[i].id === "A1") {
            roomName = "A1 Suite";
            roomPrice = 150000;
        } else {
            roomName = "Old Building Suite";
            roomPrice = 11500;
        }

        showSummary();
    });
}

// ================= SUMMARY =================
function showSummary() {
    hideAll();

    const summary = document.createElement("div");
    summary.style.color = "lemonchiffon";
    summary.style.textAlign = "center";
    summary.style.marginTop = "50px";

    summary.innerHTML = `
        <h2>Reservation Successful ✅</h2>
        <p>Name: ${fName} ${lName}</p>
        <p>Room: ${roomName}</p>
        <p>Price: ₦${roomPrice}</p>
        <p>Date: ${stayDate}</p>
    `;

    document.body.appendChild(summary);

    saveData();
}

// ================= FETCH (SAVE DATA) =================
function saveData() {
    fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: `${fName} ${lName}`,
            room: roomName,
            price: roomPrice,
            date: stayDate
        })
    })
        .then(res => res.json())
        .then(data => console.log("Saved:", data))
        .catch(err => console.log(err));
}
</script>
